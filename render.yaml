services:
  - type: web
    name: zombie-survival
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn backend.asgi:application -k uvicorn.workers.UvicornWorker --workers 1 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: zombie-survival.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://zombie-survival.onrender.com
