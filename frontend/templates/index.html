{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Zombie Survival</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body><main class="shell"><header><a class="brand" href="#home">Z<span>•</span>S</a><div id="identity" class="muted"></div></header><div id="toast" aria-live="polite"></div><section id="app"></section></main><template id="auth"><section class="hero"><p class="eyebrow">УЛИЧНАЯ ИГРА · НУРСАЯ</p><h1>Выжить<br>до рассвета.</h1><p class="muted">Реальная игра. Живые решения. Никаких перезагрузок.</p><form id="auth-form" class="card stack"><h2>Войти</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Пароль" minlength="8" required><button>Войти</button><button type="button" class="text-btn" id="toggle-auth">Нет аккаунта? Регистрация</button></form></section></template>
<template id="home"><section class="home"><div><p class="eyebrow">КОМАНДНЫЙ ЦЕНТР</p><h1>Zombie<br>Survival</h1></div><div class="actions"><button id="create">Создать игру</button><button class="secondary" id="join">Войти по коду</button><button class="secondary" id="profile">Профиль</button><button class="text-btn" id="logout">Выйти</button></div><section id="rooms" class="room-list"></section></section></template>
<template id="lobby"><section class="page"><a href="#home" class="back">← Выйти из лобби</a><p class="eyebrow">КОД КОМНАТЫ · <b id="room-code"></b></p><h1 id="room-name"></h1><div class="split"><section class="card"><h2>Участники <span id="player-count"></span></h2><div id="members" class="members"></div><button id="ready">Я готов</button></section><aside class="card organizer"><h2>Управление</h2><p class="muted" id="room-settings"></p><button id="start-game">Начать игру</button><p class="hint">Роли скрыты до старта. Организатор может управлять участниками.</p></aside></div></section></template>
<template id="game"><section class="page"><div class="game-top"><div><p class="eyebrow">КАРТА · НУРСАЯ</p><h1 id="game-room"></h1></div><div class="timer" id="timer">--:--</div></div><div class="stats"><article><span>Игроков</span><b id="g-players">0</b></article><article><span>Выживших</span><b id="g-survivors">0</b></article><article><span>Зомби</span><b id="g-zombies">0</b></article></div><section class="role-card card" id="my-role"></section><div class="split"><section class="card map"><h2>Нурсая</h2><div id="map-data" class="map-surface">Карта ждёт отметок организатора</div></section><aside class="card"><h2>События</h2><div id="events" class="events"></div><form id="event-form" class="inline"><input name="message" placeholder="Сообщение игрокам" required><button>Отправить</button></form><div class="admin-tools"><button class="secondary" id="timer-control">Таймер</button><button class="secondary" id="map-control">Карта</button><button class="secondary" id="roles-control">Роли</button><button class="secondary" id="stop-game">Остановить</button><button class="secondary" id="survivors-win">Победа выживших</button><button class="danger" id="zombies-win">Победа зомби</button></div></aside></div></section></template>
<template id="profile"><section class="page"><a href="#home" class="back">← В меню</a><div class="profile-head"><div class="avatar" id="avatar">Z</div><div><p class="eyebrow">ПРОФИЛЬ ВЫЖИВШЕГО</p><h1 id="nickname"></h1><p id="level"></p></div></div><section id="profile-stats" class="stats"></section><h2>История игр</h2><div id="history" class="history"></div></section></template>
<dialog id="modal"><form method="dialog" class="card stack" id="modal-form"><button class="close" value="cancel">×</button><div id="modal-content"></div></form></dialog><script src="{% static 'js/app.js' %}" defer></script></body></html>
